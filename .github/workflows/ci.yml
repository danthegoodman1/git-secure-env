name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  # Unit tests, plus integration tests that drive the real git binary through
  # its hooks. The runner's git decides the hook mode: config-based hooks on
  # git 2.54 and later, core.hooksPath shims before; one test always covers
  # the shims.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - run: git --version
      - run: cargo test --locked

  # The integration tests' harness is Unix-only; Windows builds gse and runs
  # its unit tests.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked --bins
